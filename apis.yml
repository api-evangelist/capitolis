aid: capitolis
name: Capitolis
description: >-
  Capitolis is a financial technology company for the capital markets that helps
  banks and institutional investors optimize how capital is used across their
  trading portfolios. Its two flagship offerings are a Capital Marketplace that
  connects banks with origination capabilities to institutional providers of
  capital, and a Portfolio Optimization service that offsets redundant and
  offsetting derivatives positions to reduce capital requirements, counterparty
  exposure, and systemic risk. By combining technology with financial expertise,
  Capitolis aims to create a safer, more efficient financial system and broaden
  access to more diversified pools of capital. The platform is delivered as a
  secure, login-gated web application to regulated financial institutions rather
  than as a public developer API.
